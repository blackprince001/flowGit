[package]
name = "flowgit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A native GPUI workspace for GitHub repositories, built on the gh CLI"

[dependencies]
gpui = "=0.2.2"
gpui-component = { version = "=0.5.0", features = ["tree-sitter-languages"] }
gpui-component-assets = "=0.5.0"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
base64 = "0.22.1"
markdown = "=1.0.0"

[profile.dev]
debug = 0

# GPUI and its renderer are far smoother optimized; app code stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
